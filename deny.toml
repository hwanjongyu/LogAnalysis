[advisories]
# Transitive unmaintained advisories through upstream gpui = "0.2.2" (tracked in MIN-12 / INF-05;
# no safe non-breaking upstream upgrade is available via crates.io).
ignore = [
    "RUSTSEC-2024-0384", # instant (via gpui 0.2.2)
    "RUSTSEC-2024-0436", # paste (via gpui 0.2.2)
    "RUSTSEC-2025-0052", # async-std (via gpui 0.2.2)
    "RUSTSEC-2025-0134", # rustls-pemfile (via gpui 0.2.2)
    "RUSTSEC-2026-0173", # proc-macro-error2 (via gpui 0.2.2 -> stacksafe)
    "RUSTSEC-2026-0192", # ttf-parser (via gpui 0.2.2 -> cosmic-text / usvg)
    "RUSTSEC-2026-0206", # rustybuzz (via gpui 0.2.2 -> cosmic-text / usvg)
    "RUSTSEC-2026-0370", # zvariant (via gpui 0.2.2 -> zbus / oo7)
    "RUSTSEC-2026-0371", # zbus_names (via gpui 0.2.2 -> zbus / oo7)
    "RUSTSEC-2026-0372", # zvariant_derive (via gpui 0.2.2 -> zbus / oo7)
    "RUSTSEC-2026-0441", # pin-utils (via gpui 0.2.2)
]

[licenses]
# Both workspace crates declare license = "MIT"; private = { ignore = true } skips unpublished workspace packages cleanly
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "NCSA",
    "Zlib",
    "0BSD",
    "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
