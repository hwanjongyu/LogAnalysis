[advisories]
ignore = []

[licenses]
# Workspace crates currently omit `license` in Cargo.toml; ignore private/unpublished workspace packages cleanly
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "NCSA",
    "Zlib",
    "0BSD",
    "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
