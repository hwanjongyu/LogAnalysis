[package]
name = "loganalysis-gui"
version = "0.2.6"
edition = "2021"
license = "MIT"
authors = ["Drew Yu"]
description = "GPU-accelerated desktop GUI for LogAnalysis using GPUI"

[dependencies]
loganalysis-core = { path = "../loganalysis-core" }
gpui = "0.2.2"
unicode-segmentation = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
anyhow = "1.0"
smallvec = "1.13"
rfd = "0.17.2"
raw-window-handle = "0.6"
open = "5"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3.13"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lib]
name = "loganalysis_gui"
path = "src/lib.rs"

[[bin]]
name = "loganalysis"
path = "src/main.rs"
