[package]
name = "loganalysis-gui"
version = "0.1.1"
edition = "2021"
authors = ["Drew Yu"]
description = "GPU-accelerated desktop GUI for LogAnalysis using GPUI"

[dependencies]
loganalysis-core = { path = "../loganalysis-core" }
gpui = "0.2.2"
unicode-segmentation = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
anyhow = "1.0"
smallvec = "1.13"
rfd = "0.17.2"
raw-window-handle = "0.6"

[[bin]]
name = "loganalysis"
path = "src/main.rs"
