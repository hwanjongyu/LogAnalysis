[package]
name = "loganalysis-core"
version = "0.2.1"
edition = "2021"
authors = ["Drew Yu"]
description = "High-performance core engine for LogAnalysis"

[dependencies]
memmap2 = "0.9"
memchr = "2.7"
aho-corasick = "1.1"
rayon = "1.10"
regex = "1.11"
fancy-regex = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.13"
uuid = { version = "1.10", features = ["v4", "serde"] }
crossbeam-channel = "0.5"
thiserror = "2.0"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.13"
