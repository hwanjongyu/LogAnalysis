name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'

permissions:
  contents: write

jobs:
  # ==========================================
  # Linux Build (AppImage, Debian .deb, Tarball)
  # ==========================================
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libvulkan-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libssl-dev \
            libfuse2 \
            libfontconfig1-dev \
            dpkg-dev \
            curl

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Release Binary
        run: cargo build --release -p loganalysis-gui

      - name: Build AppImage
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Build Debian (.deb) Package
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Create Portable Tarball
        run: |
          mkdir -p dist/portable
          cp target/release/loganalysis dist/portable/
          cp README.md dist/portable/ 2>/dev/null || true
          tar -czvf dist/LogAnalysis-linux-x86_64.tar.gz -C dist/portable loganalysis README.md

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: |
            dist/LogAnalysis-x86_64.AppImage
            dist/loganalysis_*_amd64.deb
            dist/LogAnalysis-linux-x86_64.tar.gz
          retention-days: 1

  # ==========================================
  # macOS Build (Apple Silicon & Intel)
  # ==========================================
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
            target: aarch64-apple-darwin
          - os: macos-13
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Release Binary
        run: |
          cargo build --release --target ${{ matrix.target }} -p loganalysis-gui
          strip target/${{ matrix.target }}/release/loganalysis

      - name: Package macOS Binary
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/loganalysis"
          ZIP_NAME="LogAnalysis-macos-${{ matrix.arch }}.zip"
          zip -j "dist/${ZIP_NAME}" "${BIN_PATH}" README.md

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-${{ matrix.arch }}
          path: dist/LogAnalysis-macos-${{ matrix.arch }}.zip
          retention-days: 1

  # ==========================================
  # Windows Build (x86_64)
  # ==========================================
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc -p loganalysis-gui

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/loganalysis.exe, README.md -DestinationPath dist/LogAnalysis-windows-x86_64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: dist/LogAnalysis-windows-x86_64.zip
          retention-days: 1

  # ==========================================
  # Publish Unified Release & Checksums
  # ==========================================
  publish-release:
    name: Publish Release & SHA256 Checksums
    needs: [build-linux, build-macos, build-windows]
    if: always() && !cancelled() && (needs.build-linux.result == 'success' || needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Create Release Staging Directory
        run: mkdir -p release-assets

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: release-assets
        run: |
          echo "==> Generating SHA256SUMS.txt..."
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
