name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.0.2)'
        required: true
        default: 'v0.0.2'

permissions:
  contents: write

jobs:
  # ==========================================
  # Linux Build (Ubuntu x86_64 AppImage & Tar)
  # ==========================================
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libvulkan-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libssl-dev \
            libfuse2 \
            curl

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build AppImage
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Create Portable Tarball
        run: |
          mkdir -p dist/portable
          cp target/release/loganalysis dist/portable/
          cp README.md dist/portable/ 2>/dev/null || true
          tar -czvf dist/LogAnalysis-linux-x86_64.tar.gz -C dist/portable loganalysis

      - name: Upload Linux Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          files: |
            dist/LogAnalysis-x86_64.AppImage
            dist/LogAnalysis-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # macOS Build (Apple Silicon & Intel)
  # ==========================================
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
          - os: macos-13
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Release Binary
        run: |
          cargo build --release --target ${{ matrix.target }} -p loganalysis-gui
          strip target/${{ matrix.target }}/release/loganalysis

      - name: Package macOS Binary
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/loganalysis"
          ZIP_NAME="LogAnalysis-macos-${{ matrix.arch }}.zip"
          zip -j "dist/${ZIP_NAME}" "${BIN_PATH}" README.md

      - name: Upload macOS Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          files: dist/LogAnalysis-macos-${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Windows Build (x86_64)
  # ==========================================
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Release Binary
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p loganalysis-gui

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/loganalysis.exe, README.md -DestinationPath dist/LogAnalysis-windows-x86_64.zip

      - name: Upload Windows Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          files: dist/LogAnalysis-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
